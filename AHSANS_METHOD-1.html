<style>
:root{--ink:#eef7ec;--mu:#9fb7a3;--navy:#2f6b1c;--bl:#5c9a22;--sky:rgba(155,224,63,.13);--gold:#a6e84a;--gd:#b9ec7a;--gl:rgba(155,224,63,.17);--gx:rgba(155,224,63,.09);--bg:#0b2412;--card:rgba(255,255,255,.065);--bd:rgba(255,255,255,.1);--rd:#ff7b7b;--gr:#7be0a1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{height:100%}

.nb{position:sticky;top:0;z-index:6;background:#173a20;border-bottom:1px solid var(--bd);color:var(--gold);font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;padding:9px 0}

.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 18px}
.tl{padding:16px 6px;text-align:center;font:inherit;color:var(--ink);cursor:pointer}.tl b{display:block;font-size:15px;margin-top:10px}.tl small{color:var(--mu);font-size:12px}
.ic{width:52px;height:52px;border-radius:18px;background:var(--sky);color:var(--gold);display:grid;place-items:center;margin:auto;flex:none}.ct .tl:nth-child(even) .ic{background:var(--gx);color:var(--gd)}

.mc{flex:0 0 246px;scroll-snap-align:start}.mc .ph{height:210px;background:linear-gradient(160deg,#0b2412,#2f6b1c);display:grid;place-items:center;color:var(--gl);font:700 70px 'Playfair Display',serif}.mc .ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:16px}.cb h3{font-size:18px;margin:8px 0 4px}.dt2{color:var(--mu);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0}

.chips{display:flex;gap:10px;overflow-x:auto;padding:12px 18px 8px}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:11px 18px;font:600 14px Inter,'Hind Siliguri';cursor:pointer}.chip.on{background:linear-gradient(135deg,var(--navy),var(--bl));color:#fff;border-color:transparent}

.btn{background:linear-gradient(135deg,var(--navy),var(--bl));color:#fff;border:0;border-radius:16px;font:700 16px Inter,'Hind Siliguri';padding:15px 24px;cursor:pointer;box-shadow:0 8px 18px rgba(124,181,24,.3)}.btn.full{width:100%}.btn:disabled{background:var(--gl);color:var(--gd);box-shadow:none}
.go{width:100%;border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;font:700 15px Inter;cursor:pointer}

.ec{margin:0 18px 18px;padding:18px}.eh{display:flex;justify-content:space-between}.ec h3{font-size:20px;margin:14px 0 8px}.pill{font-weight:700;font-size:12px;border-radius:99px;padding:6px 12px}.pill.LIVE{background:rgba(123,224,161,.16);color:var(--gr)}.pill.UPCOMING{background:var(--gl);color:var(--gd)}.pill.ENDED{background:rgba(255,255,255,.1);color:#b0c4b3}
.inf{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;color:var(--mu);line-height:1.9;font-size:14px;margin-bottom:14px}
.bts{display:flex;gap:8px}.bts button{flex:1;background:linear-gradient(135deg,var(--navy),var(--bl));color:#fff;border:0;border-radius:14px;padding:13px 4px;font:700 14px Inter,'Hind Siliguri'}.bts .o{background:var(--sky);color:var(--gold)}.bts .g{background:linear-gradient(135deg,#8cc63f,#c6f06b);color:#0b2412}.bts button:disabled{opacity:.5}
.pf{background:radial-gradient(circle at 80% 0,rgba(166,232,74,.25),transparent 55%),linear-gradient(160deg,#0b2412,#1d4a27 60%,#2f6b1c);border:1px solid var(--bd);color:#fff;border-radius:28px;padding:26px 20px;text-align:center;box-shadow:0 12px 28px rgba(10,42,102,.25)}
.av{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font:700 38px 'Playfair Display',serif;color:#0b2412;background:linear-gradient(135deg,#c6f06b,#7cb518);box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.pf h2{font-size:26px;margin-bottom:8px}.ps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.ps div{background:rgba(255,255,255,.1);border-radius:16px;padding:12px}.ps b{font-size:22px;display:block;color:var(--gold)}.ps small{opacity:.8}
.lab{font-weight:700;color:var(--gd);margin:24px 4px 10px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:18px;padding:6px}.seg button{border:0;background:none;border-radius:13px;padding:13px;font:700 16px Inter,'Hind Siliguri';color:var(--mu)}.seg .on{background:linear-gradient(135deg,var(--navy),var(--bl));color:#fff}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer}.row:last-child{border:0}.row .ic{margin:0;width:46px;height:46px;border-radius:15px}.row b{font-size:16px}.row small{display:block;color:var(--mu)}.row .ch{margin-left:auto;color:var(--mu)}
.so{color:var(--rd)}.so .ic{background:rgba(255,123,123,.15);color:var(--rd)}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(452px,calc(100% - 28px));background:rgba(16,46,26,.94);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:34px;box-shadow:0 14px 36px rgba(0,0,0,.45);display:flex;justify-content:space-around;align-items:center;padding:10px 8px;z-index:9}

nav button.on{background:linear-gradient(135deg,var(--navy),var(--bl));color:#fff;padding:0 18px}nav button.on svg{stroke:#fff}nav button:not(.on) span{display:none}
.h2s{min-height:100%;display:flex;flex-direction:column;background:#0b2412}
.hz{flex:1;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:30px 20px 50px;background:radial-gradient(circle at 50% 28%,rgba(166,232,74,.28),transparent 58%),linear-gradient(160deg,#0b2412,#1d4a27 55%,#2f6b1c)}

.lb{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:16px 20px;margin-top:12px;font:inherit;color:var(--ink);cursor:pointer}.lb b{font-size:20px;display:block}.lb small{color:var(--mu)}.lb.on{border-color:var(--gold);background:var(--gx)}
.f label{color:var(--mu);font-size:14px;font-weight:600;display:block}.f input{width:100%;border:0;border-bottom:2px solid var(--bd);background:none;color:var(--ink);font:500 19px Inter,'Hind Siliguri';padding:10px 0;outline:0;margin-bottom:22px}.f input:focus{border-color:var(--gold)}
.lk{text-align:center;color:var(--bl);font-weight:700;margin-top:18px;cursor:pointer}

.ah{position:sticky;top:0;z-index:6;background:#10301a;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}.ah .l{display:flex;align-items:center;gap:10px;font-weight:700}.ah img{width:40px;height:40px;border-radius:22%}
.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}.ac{padding:20px;text-align:center}.ac b{font-size:30px;display:block;color:var(--gold)}.ac small{color:var(--mu)}
.at{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px}.af{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px;margin-bottom:18px}
.af label{font-size:13px;color:var(--mu);font-weight:600;display:block;margin-bottom:4px}.af input,.af select,.af textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:500 15px Inter,'Hind Siliguri'}.af .btn{align-self:end}
.ar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd)}.ar:last-child{border:0}.ar>div{flex:1;min-width:0}.ar small{color:var(--mu);display:block}.th{width:48px;height:48px;border-radius:12px;object-fit:cover}
.dl{border:0;background:rgba(255,123,123,.16);color:var(--rd);border-radius:10px;padding:9px 14px;font:700 14px Inter;cursor:pointer}.dl.ed{background:var(--sky);color:var(--gold)}
nav[hidden]{display:none}

.auth>*{position:relative;z-index:1}
.ab{text-align:center}.ab img{width:88px;height:88px;border-radius:22%;box-shadow:0 0 0 2px rgba(166,232,74,.5),0 16px 36px rgba(0,0,0,.4)}.ab h1{font-size:28px;margin-top:12px}.ab p{color:var(--gd);font-size:14px;letter-spacing:.05em;margin-top:4px}
.gc{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}

.gb{width:100%;border:0;border-radius:16px;padding:16px;font:700 17px Inter,'Hind Siliguri';color:#0b2412;background:linear-gradient(135deg,#8cc63f,#c6f06b);box-shadow:0 10px 24px rgba(140,198,63,.35);cursor:pointer;margin-top:4px}
.gs{text-align:center;color:var(--mu);font-size:15px}.gs b{color:var(--gold);cursor:pointer}

.ac{cursor:pointer;transition:transform .15s,border-color .2s}.ac:active{transform:scale(.97)}.ac:hover{border-color:var(--gold)}

.lo.on{border-color:var(--gold);background:linear-gradient(145deg,rgba(166,232,74,.2),rgba(166,232,74,.06));box-shadow:0 0 0 3px rgba(166,232,74,.14)}
.lo.on .bd{background:linear-gradient(135deg,#8cc63f,#c6f06b);color:#0b2412}
.lo.on .rd{background:var(--gold);border-color:var(--gold)}.lo.on .rd svg{opacity:1;transform:scale(1)}
.lnote{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--mu);font-size:13px;margin-top:2px}
.lnote svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{border:1px solid rgba(255,255,255,.1)}.seg button{cursor:pointer;transition:.2s}
.seg .on{box-shadow:0 6px 16px rgba(0,0,0,.28)}

.mb{border-radius:12px;padding:9px 13px;font-weight:700;font-size:13px;background:var(--sky);color:var(--gold);text-decoration:none;white-space:nowrap}.mb.g{background:linear-gradient(135deg,#8cc63f,#c6f06b);color:#0b2412}
.row>div:nth-child(2){flex:1;min-width:0}

const normId=v=>{v=(v||'').trim();if(/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return{id:v.toLowerCase(),k:'email'};const p=v.replace(/[\s-]/g,'');if(/^(\+?88)?01[3-9]\d{8}$/.test(p))return{id:p.replace(/^\+?88/,''),k:'phone'};if(/^\+?\d{10,15}$/.test(p))return{id:p,k:'phone'};return null};
async function hp(p,id){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('am:'+id+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'plain:'+p}}

D.users.unshift({id:x.id,k:x.k,name:n,email:x.k=='email'?x.id:'',phone:x.k=='phone'?x.id:'',pw:await hp(p,x.id),joined:new Date().toISOString(),last:'',logins:0,enr:[]});save();S.pre=x.id;go('login');toast(t('created'))}

function form(k){const C=CFG[k],ed=A.e&&A.e.k==k,e=ed?D[k][A.e.i]:{};return `<div class="card af">${C.f.map(([key,l,ty,o])=>{const v=e[key]??'',id='f_'+key;

function pick(inp,w){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);IM.img=c.toDataURL('image/jpeg',.78);$('pv').textContent='Image ready ✓'};im.src=r.result};r.readAsDataURL(f)}

async function saveN(){D.notice=$('nt').value.trim();if(BE){const{error}=await sb.from('settings').upsert({id:1,notice:D.notice});return error?alert(error.message):toast('Notice saved')}save();toast('Notice saved')}
async function addCl(){const n=$('cn').value.trim();if(!n)return alert('Enter class name');if(D.classes.includes(n))return alert('This class already exists');if(BE){const{error}=await sb.from('classes').insert({name:n,sort:D.classes.length});if(error)return alert(error.message);await loadAll();return draw()}D.classes.push(n);save();draw()}
async function renCl(i){const o=D.classes[i],n=(prompt('Rename class',o)||'').trim();if(!n||n===o)return;if(BE){const a=await sb.from('classes').update({name:n}).eq('name',o);if(a.error)return alert(a.error.message);await sb.from('courses').update({class_name:n}).eq('class_name',o);await sb.from('exams').update({class_name:n}).eq('class_name',o);await sb.from('subjects').update({class_name:n}).eq('class_name',o);await loadAll();return draw()}D.classes[i]=n;D.courses.forEach(c=>{if(c.c===o)c.c=n});D.exams.forEach(c=>{if(c.c===o)c.c=n});D.subjects.forEach(c=>{if(c.c===o)c.c=n});save();draw()}
async function delCl(i){if(confirm('Delete this class? Its courses stay under All.')){if(BE){const{error}=await sb.from('classes').delete().eq('name',D.classes[i]);if(error)return alert(error.message);await loadAll();return draw()}D.classes.splice(i,1);save();draw()}}
function reset(){if(BE)return alert('Not available in live mode.');if(confirm('Restore sample data? Your changes will be lost.')){D=DEF();save();draw()}}
const fd=s=>s?new Date(s).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}):'—';
const uf=()=>{const q=(A.q||'').toLowerCase();return D.users.filter(u=>!q||[u.name,u.email,u.phone].join(' ').toLowerCase().includes(q))};
const ulist=us=>us.length?us.map(u=>`<div class="ar" style="align-items:flex-start"><div><b>${esc(u.name)}</b><small>${u.email?'✉ '+esc(u.email):''}${u.phone?'☎ '+esc(u.phone):''}</small><small>Joined: ${fd(u.joined)} · Last login: ${fd(u.last)} · Logins: ${u.logins||0}</small><small>Courses (${(u.enr||[]).length}): ${esc((u.enr||[]).join(', ')||'—')}</small></div><button class="dl" onclick="delU(${D.users.indexOf(u)})">Delete</button></div>`).join(''):'<div class="empty">No users yet.</div>';
const usr=()=>{$('ul').innerHTML=ulist(uf())};
const usersV=()=>`<div class="card af" style="grid-template-columns:1fr"><div><label>Search users by name, email or phone · ${D.users.length} total</label><input id="uq" value="${esc(A.q||'')}" oninput="A.q=this.value;usr()"></div></div><div id="ul" class="card">${ulist(uf())}</div>`;
function delU(i){if(confirm('Delete this user? They will need to sign up again.')){D.users.splice(i,1);save();draw()}}

const ADM=()=>{if(!A.auth)return `<div class="h2s"><div class="hz">${LOGOI}<h1 class="ser">Admin panel</h1></div><div class="sheet f"><label>Password</label><input id="ap" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')alog()"><button class="btn full" onclick="alog()">Login</button>${BE?'':'<p class="sub" style="text-align:center;margin-top:14px">Demo password: admin123</p>'}</div></div>`;
const T=[['dash','Dashboard'],['notice','Notice'],['banners','Banners'],['classes','Classes'],['subjects','Subjects'],['lessons','Lessons'],['courses','Courses'],['exams','Exams'],['mentors','Mentors'],['users','Users']],k=A.tab;let b='';
if(k=='dash')b=`<div class="ag">${[['Users',D.users.length],['Classes',D.classes.length],['Courses',D.courses.length],['Subjects',D.subjects.length],['Lessons',D.lessons.length],['Exams',D.exams.length],['Banners',D.banners.length],['Mentors',D.mentors.length]].map(x=>`<div class="card ac" onclick="at('${({Users:'users',Classes:'classes',Courses:'courses',Subjects:'subjects',Lessons:'lessons',Exams:'exams',Banners:'banners',Mentors:'mentors'})[x[0]]}')"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}</div><button class="go" onclick="reset()">Reset to sample data</button>`;
else if(k=='notice')b=`<div class="card af" style="grid-template-columns:1fr"><div><label>Notice bar shown at the very top of the app (leave empty to hide)</label><textarea id="nt" rows="3">${esc(D.notice)}</textarea></div><button class="btn" onclick="saveN()">Save notice</button></div>`;
else if(k=='classes')b=`<div class="card af">${`<div><label>New class name</label><input id="cn"></div>`}<button class="btn" onclick="addCl()">Add class</button></div><div class="card">${D.classes.map((c,i)=>`<div class="ar"><div><b>${esc(c)}</b></div><button class="dl ed" onclick="renCl(${i})">Rename</button><button class="dl" onclick="delCl(${i})">Delete</button></div>`).join('')}</div>`;
else if(k=='users')b=usersV();else b=form(k)+lst(k);
return `<div class="ah"><div class="l">${LOGOI}Admin panel</div><div><button class="chip" onclick="exitAdmin(0)">View app</button> <button class="chip" onclick="exitAdmin(1)">Lock admin</button></div></div><div class="pg"><div class="at">${T.map(x=>`<button class="chip ${k==x[0]?'on':''}" onclick="at('${x[0]}')">${x[1]}</button>`).join('')}</div>${b}</div>`};
V.admin=ADM;
function route(){const a=location.hash=='#admin';document.body.classList.toggle('adm',a);if(a)S.scr='admin';else if(S.scr=='admin')S.scr=U?'app':'login';draw()}
/* ---------- Supabase backend: active only when SB_URL and SB_KEY are filled in at the top ---------- */
const ae=x=>x.k=='email'?x.id:x.id.replace('+','')+'@ahsansmethod.app';
const MAP={
banners:{tb:'banners',to:x=>({title:x.t,subtitle:x.s,link:x.link||'',gradient:x.g,image:x.img||''}),from:r=>({id:r.id,t:r.title,s:r.subtitle,link:r.link||'',g:r.gradient,img:r.image||''})},
courses:{tb:'courses',to:x=>({title:x.t,class_name:x.c,details:x.d,price:x.p,old_price:x.o,teacher:x.by,gradient:x.g,image:x.img||''}),from:r=>({id:r.id,t:r.title,c:r.class_name,d:r.details,p:r.price,o:r.old_price,by:r.teacher,g:r.gradient,img:r.image||''})},
exams:{tb:'exams',to:x=>({title:x.t,class_name:x.c,subject_id:Number(x.sub)||null,status:x.st,starts:x.a,ends:x.b,duration:x.dur,marks:x.m}),from:r=>({id:r.id,t:r.title,c:r.class_name,sub:r.subject_id?String(r.subject_id):'',st:r.status,a:r.starts,b:r.ends,dur:r.duration,m:r.marks})},
subjects:{tb:'subjects',asc:1,to:x=>({name:x.n,class_name:x.c||null,course_id:cid(x.crs)}),from:r=>({id:String(r.id),n:r.name,c:r.class_name||'',crs:ctitle(r.course_id)})},
lessons:{tb:'lessons',asc:1,to:x=>({subject_id:Number(x.sub)||null,kind:x.k,title:x.t,url:x.u}),from:r=>({id:String(r.id),sub:String(r.subject_id||''),k:r.kind,t:r.title,u:r.url})},
mentors:{tb:'mentors',to:x=>({name:x.n,role:x.r,bio:x.s,image:x.img||''}),from:r=>({id:r.id,n:r.name,r:r.role,s:r.bio,img:r.image||''})}};
const MK=['banners','courses','exams','mentors'];
const cid=t=>{const c=D.courses.find(c=>c.t==t);return c?c.id:null},ctitle=i=>{const c=D.courses.find(c=>c.id==i);return c?c.t:''};
async function rk(k){await reloadK(k);if(k=='courses'||k=='subjects'){await reloadK('subjects');await reloadK('lessons');if(k=='subjects')await reloadK('exams')}}
async function reloadK(k){const{data}=await sb.from(MAP[k].tb).select('*').order('id',{ascending:!!MAP[k].asc});D[k]=(data||[]).map(MAP[k].from)}
async function loadAll(){const[s,c]=await Promise.all([sb.from('settings').select('notice').eq('id',1).maybeSingle(),sb.from('classes').select('name').order('sort').order('id'),...MK.map(reloadK)]);D.notice=(s.data&&s.data.notice)||'';D.classes=(c.data||[]).map(x=>x.name);await reloadK('subjects');await reloadK('lessons')}
async function bsv(k,o,ed){const row=MAP[k].to(o),T=MAP[k].tb,r=ed?await sb.from(T).update(row).eq('id',D[k][A.e.i].id):await sb.from(T).insert(row);if(r.error)return alert(r.error.message);IM.img=null;A.e=null;await rk(k);draw()}
async function bdel(k,i){const{error}=await sb.from(MAP[k].tb).delete().eq('id',D[k][i].id);if(error)return alert(error.message);await rk(k);draw()}
async function loadUsers(){const{data,error}=await sb.from('profiles').select('id,name,email,phone,joined,last_login,logins,enrollments(courses(title))').order('joined',{ascending:false});if(error)return alert(error.message);D.users=data.map(u=>({id:u.id,name:u.name,email:u.email||'',phone:u.phone||'',joined:u.joined,last:u.last_login||'',logins:u.logins||0,enr:(u.enrollments||[]).map(e=>e.courses&&e.courses.title).filter(Boolean)}))}
async function afterAuth(){const{data:{session}}=await sb.auth.getSession();SID='';U='';ENR=[];A.auth=false;if(!session)return;const id=session.user.id,{data:pr}=await sb.from('profiles').select('name,is_admin').eq('id',id).maybeSingle();if(!pr){await sb.auth.signOut();return}SID=id;U=pr.name;const{data:en}=await sb.from('enrollments').select('courses(title)').eq('user_id',id);ENR=(en||[]).map(e=>e.courses&&e.courses.title).filter(Boolean)}
async function boot(){draw();await Promise.all([(async()=>{await afterAuth().catch(e=>console.error(e));await loadAll().catch(e=>console.error(e))})(),new Promise(r=>setTimeout(r,2000))]);if(location.hash=='#admin')route();else go(U?'app':'lang')}
if(BE){
doSignup=async function(){const n=$('sn').value.trim(),x=normId($('si').value),p=$('sp').value;if(!n)return alert(t('eName'));if(!x)return alert(t('eId'));if(p.length<6)return alert(t('pw6'));if(p!==$('sc').value)return alert(t('eMatch'));
const{data,error}=await sb.auth.signUp({email:ae(x),password:p,options:{data:{name:n,ident:x.id,kind:x.k}}});if(error)return alert(/already|registered/i.test(error.message)?t('eExists'):error.message);if(data.user&&data.user.identities&&!data.user.identities.length)return alert(t('eExists'));
await sb.auth.signOut();S.pre=x.id;go('login');toast(t('created'))};
doLogin=async function(){const x=normId($('ln').value),p=$('lp').value;if(!x)return alert(t('eId'));if(!p)return alert(t('ePass'));const{error}=await sb.auth.signInWithPassword({email:ae(x),password:p});if(error)return alert(/invalid/i.test(error.message)?t('eBad'):error.message);await sb.rpc('touch_login');await afterAuth();if(!U)return alert(t('eBad'));await loadAll();S.pre='';go('app')};
out=async function(){await sb.auth.signOut();SID='';U='';ENR=[];A.auth=false;D.lessons=[];go('login')};
enr=async function(i){const c=D.courses[i];if(!c||ENR.includes(c.t))return;const{error}=await sb.from('enrollments').insert({user_id:SID,course_id:c.id});if(error)return alert(error.message);ENR.push(c.t);await reloadK('lessons');toast(t('enrT'));draw(1)};
delU=async function(i){if(!confirm('Delete this user? They will need to sign up again.'))return;const{error}=await sb.rpc('admin_delete_user',{uid:D.users[i].id});if(error)return alert(error.message);await loadUsers();draw()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.scr=='app')loadAll().then(()=>draw(1))});
}

addEventListener('hashchange',route);
if(BE)boot();else if(location.hash=='#admin')route();else{draw();setTimeout(()=>{if(S.scr=='splash')go(U?'app':'lang')},2000)}
</script></body></html>
